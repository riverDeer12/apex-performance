trigger:
  - test

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Test'
  projectFile: 'src/ApexPerformance.API/ApexPerformance.API.csproj'
  startupProject: 'src/ApexPerformance.API/ApexPerformance.API.csproj'
  outputSql: '$(Build.ArtifactStagingDirectory)\migrations.sql'

steps:
  - checkout: self
    fetchDepth: 0

  - task: UseDotNet@2
    displayName: 'Install .NET SDK (8.x LTS)'
    inputs:
      packageType: 'sdk'
      version: '8.x'

  # Install dotnet-ef BEFORE restore so it doesn't interfere with the cache
  - script: |
      dotnet tool install -g dotnet-ef ^
        --version 8.0.8 ^
        --add-source https://api.nuget.org/v3/index.json ^
        --ignore-failed-sources
    displayName: 'Install dotnet-ef (global, from nuget.org)'

  - script: echo ##vso[task.prependpath]%USERPROFILE%\.dotnet\tools
    displayName: 'Add dotnet-ef to PATH'

  - script: dotnet restore $(projectFile)
    displayName: 'Restore'

  - script: dotnet build $(projectFile) -c $(buildConfiguration) --no-restore
    displayName: 'Build ($(buildConfiguration))'

  # --no-restore instead of --no-build so asset resolution runs correctly
  - script: dotnet publish $(projectFile) -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory) --no-restore
    displayName: 'Publish (dotnet publish -c Test ApexPerformance.API.csproj)'

  - task: ArchiveFiles@2
    displayName: 'Zip published output'
    inputs:
      rootFolderOrFile: '$(Build.ArtifactStagingDirectory)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/drop_api_test.zip'
      replaceExistingArchive: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish artifact'
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)'
      artifactName: 'drop_api_test'
      publishLocation: 'Container'