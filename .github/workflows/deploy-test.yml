name: Deploy to Test

on:
  push:
    branches:
      - test

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  PROJECT_FILE: src/ApexPerformance.API/ApexPerformance.API.csproj
  BUILD_CONFIGURATION: Test
  ASPNETCORE_ENVIRONMENT: Test
  SITE_NAME: test.apex-performance.fit
  APP_POOL_NAME: ApexPerformanceTest
  DEPLOY_PATH: C:\inetpub\wwwroot\apex-performance-test
  PUBLISH_DIR: publish_output

jobs:
  deploy:
    runs-on: [self-hosted, apex-performance]
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_FILE }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_FILE }} -c ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_FILE }} -c ${{ env.BUILD_CONFIGURATION }} -o ${{ env.PUBLISH_DIR }} --no-restore

      - name: Install dotnet-ef (if missing)
        shell: powershell
        run: |
          $installed = dotnet tool list -g | Select-String "dotnet-ef"
          if (-not $installed) {
            dotnet tool install -g dotnet-ef --version 8.0.8
          }

      - name: Apply EF Core migrations
        shell: powershell
        env:
          MIGRATION_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          dotnet ef database update `
            --project ${{ env.PROJECT_FILE }} `
            --startup-project ${{ env.PROJECT_FILE }} `
            --context ApexPerformanceContext `
            --connection "$env:MIGRATION_CONNECTION_STRING"

      - name: Stop app pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          $name = "${{ env.APP_POOL_NAME }}"
          # Stopping a pool that is already stopped is an error, and a pool that is still
          # stopping keeps the DLLs locked: stop it if needed and wait until it really stopped.
          if ((Get-WebAppPoolState -Name $name).Value -ne "Stopped") { Stop-WebAppPool -Name $name -ErrorAction SilentlyContinue }
          for ($i = 0; $i -lt 60 -and (Get-WebAppPoolState -Name $name).Value -ne "Stopped"; $i++) { Start-Sleep -Seconds 1 }
          $state = (Get-WebAppPoolState -Name $name).Value
          Write-Host "App pool state: $state"
          if ($state -ne "Stopped") { throw "App pool did not stop" }
          Start-Sleep -Seconds 2

      - name: Sync published files (preserve appsettings, web.config, wwwroot, Logs, firebase key)
        shell: cmd
        run: >
          robocopy "${{ env.PUBLISH_DIR }}" "${{ env.DEPLOY_PATH }}" /MIR /R:3 /W:5
          /XF appsettings.json appsettings.Development.json appsettings.Test.json *firebase-adminsdk*.json web.config
          /XD Logs wwwroot ApexPerformanceCollection
          & if %ERRORLEVEL% GEQ 8 (exit /b 1) else (exit /b 0)

      - name: Start app pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          $name = "${{ env.APP_POOL_NAME }}"
          # A pool that is still stopping can't be started yet ("cannot accept control
          # messages"), so keep trying for a minute.
          for ($i = 0; $i -lt 30; $i++) {
            $state = (Get-WebAppPoolState -Name $name).Value
            if ($state -eq "Started") { break }
            if ($state -eq "Stopped") { Start-WebAppPool -Name $name -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }
          $state = (Get-WebAppPoolState -Name $name).Value
          Write-Host "App pool state: $state"
          if ($state -ne "Started") { throw "App pool did not start" }

      - name: Health check
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $response = Invoke-WebRequest -Uri "https://${{ env.SITE_NAME }}/swagger/v1/swagger.json" -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -ne 200) { throw "Health check failed with status $($response.StatusCode)" }
          Write-Host "Health check passed: $($response.StatusCode)"
